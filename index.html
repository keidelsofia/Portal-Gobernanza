            grid-template-columns: repeat(3, minmax(0, 1fr));

        .opcion {
            min-height: 165px;
            padding: 25px;

            background: var(--blanco);

            border: 1px solid var(--borde);
            border-radius: 23px 8px 23px 8px;

            box-shadow: 0 9px 25px rgba(22, 42, 55, 0.06);
            cursor: pointer;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

            border-color: var(--verde);
            box-shadow: 0 15px 35px rgba(22, 42, 55, 0.12);
            transform: translateY(-5px);

            position: absolute;
            top: 16px;
            right: 18px;

            width: 36px;
            height: 36px;

            color: var(--texto-suave);
            background: var(--fondo);

            border: 0;
            border-radius: 50%;

            font-size: 21px;
            cursor: pointer;

            position: fixed;
            right: 25px;
            bottom: 25px;
            z-index: 200;

            padding: 14px 18px;

            color: var(--blanco);
            background: var(--verde-oscuro);

            border-radius: 16px 6px 16px 6px;
            box-shadow: 0 16px 40px rgba(23, 45, 61, 0.18);

            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }

        .aviso.visible {
            opacity: 1;
            transform: translateY(0);
        }

            .aplicacion {

            .boton-menu {

            .usuario-texto {

            .contenido {

            .bienvenida {

                padding: 34px 26px;

            .ilustracion {

        @media (max-width: 650px) {

            .grilla-opciones {

            .bienvenida h1 {

                        "▦",
                        "Comités activos",
                        "Consulta de los comités vigentes."
                    ],
                    [
                        "□",
                        "Calendario",
                        "Próximas reuniones y agenda."
                    ],
                    [
                        "☑",
                        "Acciones",
                        "Seguimiento de acciones y responsables."
                    ],
                    [
                        "✓",
                        "Asistencia",
                        "Registro de asistencia a reuniones."
                    ],
                    [
                        "☰",
                        "Actas",
                        "Acceso a actas y documentación."
                    ],
                    [
                        "▥",
                        "Indicadores",
                        "Panel general de seguimiento."
                    ]
                ]
            }
        };

        function seleccionarMenu(nombre) {
            const botones = document.querySelectorAll(".menu-item");

            botones.forEach(function (boton) {
                boton.classList.remove("activo");

                if (boton.dataset.modulo === nombre) {
                    boton.classList.add("activo");
                }
            });
        }

        function cargarModulo(nombre, elementoMenu) {
            cerrarMenuMovil();
            seleccionarMenu(nombre);

            if (nombre === "inicio") {
                cargarInicio();
                return;
            }

            const modulo = modulos[nombre];

            if (!modulo) {
                return;
            }

            tituloPagina.textContent = modulo.titulo;

            const tarjetas = modulo.opciones
                .map(function (opcion) {
                    return `
                        <article
                            class="opcion"
                            onclick="abrirOpcion(
                                '${opcion[1]}',
                                '${opcion[2]}'
                            )"
                        >
                            <span>${opcion[0]}</span>
                            <h3>${opcion[1]}</h3>
                            <p>${opcion[2]}</p>
                        </article>
                    `;
                })
                .join("");

            contenido.innerHTML = `
                <section
                    class="panel-encabezado"
                    style="
                        --color-1: ${modulo.color1};
                        --color-2: ${modulo.color2};
                    "
                >
                    <span
                        class="volver"
                        onclick="cargarInicio()"
                    >
                        ← Volver al inicio
                    </span>

                    <h1>${modulo.titulo}</h1>
                    <p>${modulo.descripcion}</p>
                </section>

                <div class="encabezado-seccion">
                    <div>
                        <h2>Opciones disponibles</h2>
                        <p>
                            Seleccioná una opción para explorar
                            la maqueta.
                        </p>
                    </div>
                </div>

                <section class="grilla-opciones">
                    ${tarjetas}
                </section>
            `;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        function cargarInicio() {
            seleccionarMenu("inicio");
            tituloPagina.textContent = "Inicio";

            contenido.innerHTML = `
                <section class="bienvenida">

                    <div>
                        <span class="etiqueta">
                            Portal interno | Versión demostrativa
                        </span>

                        <h1>
                            La gestión estratégica,
                            en un solo lugar.
                        </h1>

                        <p>
                            Un espacio para acompañar la gobernanza,
                            facilitar el acceso a la información y
                            conectar el NPS, el Planeamiento Estratégico,
                            el GPD Ágil y los Comités.
                        </p>
                    </div>

                    <div class="ilustracion">
                        <div class="circulo-principal">
                            <span>⚡</span>
                        </div>
                    </div>

                </section>

                <div class="encabezado-seccion">
                    <div>
                        <h2>Explorá Gobernanza</h2>
                        <p>
                            Ingresá al módulo que necesitás
                            consultar o gestionar.
                        </p>
                    </div>
                </div>

                <section class="grilla-modulos">

                    <article
                        class="tarjeta-modulo nps"
                        onclick="cargarModulo('nps')"
                    >
                        <div class="icono-modulo">◎</div>

                        <h3>NPS</h3>

                        <p>
                            Resultados, evolución, comentarios y
                            seguimiento de planes de acción.
                        </p>

                        <span class="flecha">→</span>
                    </article>

                    <article
                        class="tarjeta-modulo planeamiento"
                        onclick="cargarModulo('planeamiento')"
                    >
                        <div class="icono-modulo">◆</div>

                        <h3>Planeamiento Estratégico</h3>

                        <p>
                            Objetivos, indicadores, análisis SWOT
                            y prioridades estratégicas.
                        </p>

                        <span class="flecha">→</span>
                    </article>

                    <article
                        class="tarjeta-modulo gpd"
                        onclick="cargarModulo('gpd')"
                    >
                        <div class="icono-modulo">⚡</div>

                        <h3>GPD Ágil</h3>

                        <p>
                            Áreas, desafíos, objetivos, resultados
                            clave, iniciativas y actividades.
                        </p>

                        <span class="flecha">→</span>
                    </article>

                    <article
                        class="tarjeta-modulo comites"
                        onclick="cargarModulo('comites')"
                    >
                        <div class="icono-modulo">▦</div>

                        <h3>Comités</h3>

                        <p>
                            Calendario, reuniones, acciones,
                            responsables, actas e indicadores.
                        </p>

                        <span class="flecha">→</span>
                    </article>

                </section>
            `;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        function abrirOpcion(titulo, descripcion) {
            dialogoInformacion.innerHTML = `
                <h2>${titulo}</h2>

                <p>${descripcion}</p>

                <p style="margin-top: 16px;">
                    Esta sección forma parte de la maqueta inicial.
                    En una próxima etapa podrá conectarse con
                    Power BI, SharePoint, Power Apps o una
                    aplicación desarrollada en Python.
                </p>
            `;

            if (typeof dialogo.showModal === "function") {
                dialogo.showModal();
            }

            mostrarAviso("Opción seleccionada: " + titulo);
        }

        function cerrarDialogo() {
            dialogo.close();
        }

        function mostrarAviso(mensaje) {
            aviso.textContent = mensaje;
            aviso.classList.add("visible");

            setTimeout(function () {
                aviso.classList.remove("visible");
            }, 2300);
        }

        function alternarMenu() {
            document
                .getElementById("sidebar")
                .classList
                .toggle("abierto");
        }

        function cerrarMenuMovil() {
            document
                .getElementById("sidebar")
                .classList
                .remove("abierto");
        }

        dialogo.addEventListener("click", function (evento) {
            if (evento.target === dialogo) {
                cerrarDialogo();
            }
        });

        window.addEventListener("DOMContentLoaded", function () {
            cargarInicio();
        });
    </script>

</body>

</html>
