<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portal de Gobernanza</title>

    ./style.css
</head>

<body>

    <!-- Menú lateral -->
    <aside class="sidebar" id="sidebar">

        <div class="marca">
            <div class="logo">M</div>

            <div class="marca-texto">
                <strong>Portal de Gobernanza</strong>
                <span>Moura Argentina</span>
            </div>
        </div>

        <nav class="menu">

            <button class="menu-item activo" onclick="cargarModulo('inicio', this)">
                <span class="menu-icono">⌂</span>
                <span>Inicio</span>
            </button>

            <button class="menu-item" onclick="cargarModulo('nps', this)">
                <span class="menu-icono">◎</span>
                <span>NPS</span>
            </button>

            <button class="menu-item" onclick="cargarModulo('planeamiento', this)">
                <span class="menu-icono">◆</span>
                <span>Planeamiento Estratégico</span>
            </button>

            <button class="menu-item" onclick="cargarModulo('gpd', this)">
                <span class="menu-icono">⚡</span>
                <span>GPD Ágil</span>
            </button>

            <button class="menu-item" onclick="cargarModulo('comites', this)">
                <span class="menu-icono">▦</span>
                <span>Comités</span>
            </button>

        </nav>

        <div class="sidebar-footer">
            <span class="estado"></span>
            Versión demostrativa
        </div>

    </aside>

    <!-- Contenido principal -->
    <main class="aplicacion">

        <header class="barra-superior">

            <button class="boton-menu" onclick="alternarMenu()">☰</button>

            <div>
                <p class="ubicacion">Gestión Estratégica</p>
                <h2 id="titulo-pagina">Inicio</h2>
            </div>

            <div class="usuario">
                <div class="avatar">SK</div>

                <div class="usuario-texto">
                    <strong>Sofia Keidel</strong>
                    <span>Gobernanza y Proyectos Estratégicos</span>
                </div>
            </div>

        </header>

        <section id="contenido" class="contenido"></section>

    </main>

    <!-- Ventana emergente -->
    <dialog id="dialogo">

        <div class="dialogo-contenido">

            <button class="cerrar-dialogo" onclick="cerrarDialogo()">×</button>

            <div id="dialogo-informacion"></div>

        </div>

    </dialog>

    <!-- Aviso inferior -->
    <div id="aviso" class="aviso"></div>

    ./script.jsscript>

</body>

</html>
