<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal de Gobernanza</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#eef2f7;
}

.hero{

background:linear-gradient(135deg,#0a5c36,#0c8a52);

color:white;

padding:80px 40px;

text-align:center;

}

.hero h1{
font-size:50px;
margin-bottom:15px;
}

.hero p{
font-size:20px;
opacity:0.9;
}

.dashboard{

max-width:1300px;

margin:auto;

padding:40px;

margin-top:-40px;

}

.kpis{

display:flex;

gap:20px;

justify-content:center;

flex-wrap:wrap;

margin-bottom:50px;

}

.kpi{

background:white;

width:220px;

padding:25px;

border-radius:20px;

text-align:center;

box-shadow:0 8px 25px rgba(0,0,0,0.08);

}

.numero{

font-size:36px;

font-weight:bold;

color:#0a5c36;

margin-bottom:5px;

}

.titulo{

font-size:14px;

color:#666;

}

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

gap:25px;

}

.card{

padding:35px;

border-radius:25px;

text-decoration:none;

color:white;

transition:0.4s;

box-shadow:0 10px 25px rgba(0,0,0,0.15);

}

.card:hover{

transform:translateY(-8px);

}

.card h2{
margin-bottom:15px;
font-size:28px;
}

.card p{
line-height:1.6;
}

.gob{
background:linear-gradient(135deg,#0A5C36,#18A558);
}

.proy{
background:linear-gradient(135deg,#004AAD,#2F80ED);
}

.footer{

text-align:center;

padding:30px;

color:#888;

}

</style>

</head>

<body>

<section class="hero">

<h1>Portal de Gobernanza</h1>

<p>Gestión Estratégica | Baterías Moura</p>

</section>

<div class="dashboard">

<div class="kpis">

<div class="kpi">

<div class="titulo">Comités Activos</div>
</div>

<div class="kpi">
<div class="numero">86</div>
<div class="titulo">Acciones Abiertas</div>
</div>

<div class="kpi">
<div class="numero">92%</div>
<div class="titulo">NPS General</div>
</div>

<div class="kpi">
<div class="numero">18</div>
<div class="titulo">Proyectos Estratégicos</div>
</div>

</div>

<div class="cards">

<a href="governanza2>📋 Gobernanza</h2>

<p>

</p>

<p>

hitos, riesgos e indicadores.
</p>

</a>

</div>

</div>

<div class="footer">

Portal de Gobernanza Moura | Versión Beta

</div>

</body>

</html>
